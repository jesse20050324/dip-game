<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>第十二关 · 海边灯塔十案</title>
  <style>
    body { margin: 0; font-family: "Segoe UI", sans-serif; background: #221e18; color: #e8dcc8; padding: 28px 32px 80px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .brief { color: #a89880; font-size: 13px; line-height: 1.55; max-width: 860px; margin: 0 0 28px; padding: 12px 14px; border-left: 3px solid #c4a268; }
    .brief strong { color: #f0e6d2; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(640px, 1fr)); gap: 28px; }
    article { background: #2c261e; border: 1px solid #3d3428; padding: 16px; }
    h2 { font-size: 15px; margin: 0 0 4px; color: #f0e6d2; }
    .why { font-size: 12px; color: #9a8b74; margin: 0 0 12px; line-height: 1.45; }
    .row { display: flex; gap: 14px; flex-wrap: wrap; }
    figure { margin: 0; }
    figcaption { font-size: 11px; color: #9a8b74; margin-top: 6px; text-align: center; }
    canvas { display: block; width: 192px; height: 192px; image-rendering: pixelated; image-rendering: crisp-edges; background: #111; box-shadow: 0 6px 0 #14110e; }
  </style>
</head>
<body>
  <h1>第十二关 · 海边 + 红灯塔 · 十套方案（只看图）</h1>
  <p class="brief">
    <strong>玩法还是去戳：</strong>戳是最亮一层，只盖在天上，并进天。
    灯塔带红色（红顶 / 红白纹 / 红塔身 / 红门），颜色可以比三色多：天、海、沙、白墙、红、深色灯室、礁石都可以分开。
    每套三张：开局带戳 · 灰度 · 修好无戳。
  </p>
  <div class="grid" id="gallery"></div>
  <script>
    const N = 64;
    const C = {
      sky: "#7eafd2",
      dusk: "#d4895a",
      night: "#2a3858",
      sea: "#2f6f88",
      deep: "#1e3a50",
      sand: "#e0c8a0",
      foam: "#e8e0d4",
      white: "#f3eee4",
      red: "#c94f3d",
      dark: "#2b241c",
      rock: "#6a5a50",
      lamp: "#e8b84a",
      wood: "#8a5a38",
      stamp: "#f2efe4",
    };
    const GRAY = {
      dark: 32, rock: 55, sand: 75, wood: 90, sea: 110, deep: 110,
      red: 135, white: 158, foam: 170, lamp: 200, sky: 185, dusk: 185, night: 185, stamp: 240,
    };
    const F = {
      A: [".#.", "#.#", "###", "#.#", "#.#"],
      E: ["###", "#..", "##.", "#..", "###"],
      G: ["###", "#..", "#.#", "#.#", "###"],
      I: ["###", ".#.", ".#.", ".#.", "###"],
      J: [".##", "..#", "..#", "#.#", ".#."],
      K: ["#.#", "#.#", "##.", "#.#", "#.#"],
      L: ["#..", "#..", "#..", "#..", "###"],
      M: ["#.#", "###", "#.#", "#.#", "#.#"],
      N: ["#.#", "##.", "#.#", "#.#", "#.#"],
      O: ["###", "#.#", "#.#", "#.#", "###"],
      S: ["###", "#..", "###", "..#", "###"],
      U: ["#.#", "#.#", "#.#", "#.#", "###"],
      Z: ["###", "..#", ".#.", "#..", "###"],
      "0": ["###", "#.#", "#.#", "#.#", "###"],
      "1": [".#.", "##.", ".#.", ".#.", "###"],
      "2": ["###", "..#", "###", "#..", "###"],
      "4": ["#.#", "#.#", "###", "..#", "..#"],
      "7": ["###", "..#", ".#.", ".#.", ".#."],
      "8": ["###", "#.#", "###", "#.#", "###"],
      "9": ["###", "#.#", "###", "..#", "###"],
      " ": ["...", "...", "...", "...", "..."],
    };

    function grid(fill) { return Array.from({ length: N }, () => Array(N).fill(fill)); }
    function set(g, x, y, v) {
      if (y >= 0 && y < N && x >= 0 && x < N) g[y][x] = v;
    }
    function rect(g, x0, y0, w, h, v) {
      for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) set(g, x, y, v);
    }
    function text(g, x, y, str, v) {
      let cx = x;
      for (const ch of str) {
        (F[ch] || F[" "]).forEach((row, j) => {
          [...row].forEach((c, i) => { if (c === "#") set(g, cx + i, y + j, v); });
        });
        cx += 4;
      }
    }
    function stampOnSky(g, x, y, str) {
      const t = grid(0);
      text(t, x, y, str, 1);
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
        if (t[j][i] && (g[j][i] === "sky" || g[j][i] === "dusk" || g[j][i] === "night")) g[j][i] = "stamp";
      }
    }
    function grayHex(v) {
      const h = Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0");
      return "#" + h + h + h;
    }
    function blit(canvas, cells) {
      canvas.width = N; canvas.height = N;
      const ctx = canvas.getContext("2d");
      const img = ctx.createImageData(N, N);
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        const hex = cells[y][x];
        const i = (y * N + x) * 4;
        img.data[i] = parseInt(hex.slice(1, 3), 16);
        img.data[i + 1] = parseInt(hex.slice(3, 5), 16);
        img.data[i + 2] = parseInt(hex.slice(5, 7), 16);
        img.data[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
    }
    function colorize(roles, pal) {
      return roles.map((row) => row.map((r) => (r === "stamp" ? C.stamp : pal[r])));
    }
    function grayize(roles) {
      return roles.map((row) => row.map((r) => grayHex(GRAY[r] ?? 128)));
    }

    function seaBand(g, y0, y1, role) {
      for (let y = y0; y < y1; y++) for (let x = 0; x < N; x++) set(g, x, y, role);
    }
    function sandFrom(g, yAtX) {
      for (let x = 0; x < N; x++) {
        const y0 = Math.round(yAtX(x));
        for (let y = y0; y < N; y++) set(g, x, y, "sand");
      }
    }
    function foamLine(g, yAtX) {
      for (let x = 0; x < N; x++) set(g, x, Math.round(yAtX(x)), "foam");
    }

    function lighthouse(g, cx, foot, h, style) {
      const top = foot - h;
      for (let y = top + 8; y < foot; y++) {
        const t = (y - (top + 8)) / Math.max(1, foot - top - 8);
        const half = 2 + Math.round(t * 2);
        let role = "white";
        if (style === "stripes" || style === "lamp") {
          role = Math.floor((y - top) / 5) % 2 === 0 ? "white" : "red";
        }
        if (style === "redbody") role = "red";
        for (let x = cx - half; x <= cx + half; x++) set(g, x, y, role);
      }
      rect(g, cx - 4, top + 6, 9, 3, style === "redbody" ? "white" : "red");
      if (style === "reddoor") rect(g, cx - 1, foot - 6, 3, 6, "red");
      if (style === "roof" || style === "stripes" || style === "reddoor") {
        rect(g, cx - 2, top + 2, 5, 5, style === "roof" ? "white" : "dark");
        for (let i = 0; i < 6; i++) {
          const w = 7 - i;
          const x0 = cx - Math.floor((w - 1) / 2);
          for (let x = x0; x < x0 + w; x++) set(g, x, top + 1 - i, "red");
        }
      }
      if (style === "redbody") {
        rect(g, cx - 2, top + 2, 5, 5, "white");
        for (let i = 0; i < 4; i++) {
          const w = 5 - i;
          const x0 = cx - Math.floor((w - 1) / 2);
          for (let x = x0; x < x0 + w; x++) set(g, x, top + 1 - i, "dark");
        }
      }
      if (style === "lamp") {
        rect(g, cx - 2, top + 2, 5, 5, "lamp");
        for (let i = 0; i < 4; i++) {
          const w = 5 - i;
          const x0 = cx - Math.floor((w - 1) / 2);
          for (let x = x0; x < x0 + w; x++) set(g, x, top + 1 - i, "red");
        }
      }
      set(g, cx, top + 16, "dark");
      set(g, cx, top + 22, "dark");
      set(g, cx, top + 28, "dark");
    }
    function rocks(g, pts) {
      pts.forEach(([x, y]) => set(g, x, y, "rock"));
    }

    const SCENES = [
      {
        id: 1, name: "红顶白塔",
        why: "白天，右岸沙嘴，白塔红锥顶。",
        stamp: [4, 6, "98 7"],
        pal: { sky: C.sky, sea: C.sea, sand: C.sand, foam: C.foam, white: C.white, red: C.red, dark: C.dark, rock: C.rock },
        make() {
          const g = grid("sky");
          seaBand(g, 38, 52, "sea");
          sandFrom(g, (x) => (x > 36 ? Math.max(45, 52 - (x - 36) / 3) : 52));
          foamLine(g, (x) => (x > 36 ? Math.max(45, 52 - (x - 36) / 3) : 52));
          lighthouse(g, 48, 52, 40, "roof");
          rocks(g, [[42, 50], [43, 51], [54, 50], [55, 51]]);
          return g;
        },
      },
      {
        id: 2, name: "红白横纹",
        why: "经典糖条纹，红白相间，红顶。",
        stamp: [4, 6, "JUN 4"],
        pal: { sky: C.sky, sea: C.sea, sand: C.sand, foam: C.foam, white: C.white, red: C.red, dark: C.dark, rock: C.rock },
        make() {
          const g = grid("sky");
          seaBand(g, 40, 53, "sea");
          sandFrom(g, (x) => 53 - (x > 40 ? 2 : 0));
          foamLine(g, () => 53);
          lighthouse(g, 46, 54, 42, "stripes");
          rocks(g, [[40, 52], [41, 53], [52, 52]]);
          return g;
        },
      },
      {
        id: 3, name: "红塔白顶",
        why: "塔身全红，回廊和灯室是白的。",
        stamp: [40, 6, "2002"],
        pal: { sky: C.sky, sea: C.sea, sand: C.sand, foam: C.foam, white: C.white, red: C.red, dark: C.dark, rock: C.rock },
        make() {
          const g = grid("sky");
          seaBand(g, 36, 50, "sea");
          sandFrom(g, (x) => (x < 28 ? Math.max(46, 50 - (28 - x) / 4) : 50));
          lighthouse(g, 18, 50, 38, "redbody");
          rocks(g, [[12, 48], [13, 49], [24, 48]]);
          return g;
        },
      },
      {
        id: 4, name: "栈桥尽头",
        why: "一条木栈桥伸进海里，尽头红顶白塔。",
        stamp: [4, 6, "98 7"],
        pal: { sky: C.sky, sea: C.sea, sand: C.sand, foam: C.foam, white: C.white, red: C.red, dark: C.dark, rock: C.rock, wood: C.wood },
        make() {
          const g = grid("sky");
          seaBand(g, 34, N, "sea");
          sandFrom(g, () => 56);
          for (let x = 8; x < 50; x++) {
            for (let y = 48; y <= 52; y++) set(g, x, y, "wood");
          }
          for (const x of [12, 22, 32, 42]) rect(g, x, 52, 2, 6, "wood");
          lighthouse(g, 50, 49, 36, "roof");
          return g;
        },
      },
      {
        id: 5, name: "悬崖",
        why: "左边高崖，红白纹灯塔立在崖上，海在下面。",
        stamp: [36, 6, "AZ"],
        pal: { sky: C.sky, sea: C.sea, sand: C.sand, foam: C.foam, white: C.white, red: C.red, dark: C.dark, rock: C.rock },
        make() {
          const g = grid("sky");
          seaBand(g, 44, N, "sea");
          for (let x = 0; x < 28; x++) {
            const top = 28 + Math.round((x / 28) * 8);
            for (let y = top; y < N; y++) set(g, x, y, "rock");
          }
          sandFrom(g, (x) => (x < 28 ? 64 : 58));
          for (let x = 28; x < N; x++) for (let y = 58; y < N; y++) set(g, x, y, "sand");
          lighthouse(g, 14, 30, 28, "stripes");
          return g;
        },
      },
      {
        id: 6, name: "近景红门",
        why: "塔更大，白墙、红门、红顶，能看清门。",
        stamp: [4, 5, "NO 8"],
        pal: { sky: C.sky, sea: C.sea, sand: C.sand, foam: C.foam, white: C.white, red: C.red, dark: C.dark, rock: C.rock },
        make() {
          const g = grid("sky");
          seaBand(g, 42, 54, "sea");
          sandFrom(g, () => 54);
          foamLine(g, () => 54);
          lighthouse(g, 32, 56, 48, "reddoor");
          rocks(g, [[24, 53], [25, 54], [40, 53], [41, 54]]);
          return g;
        },
      },
      {
        id: 7, name: "夕阳",
        why: "橙天、深海、红白纹塔。戳仍盖在天上。",
        stamp: [4, 6, "AUG 9"],
        pal: { dusk: C.dusk, deep: C.deep, sand: C.sand, foam: C.foam, white: C.white, red: C.red, dark: C.dark, rock: C.rock },
        make() {
          const g = grid("dusk");
          seaBand(g, 40, 54, "deep");
          sandFrom(g, (x) => 54 - (x > 38 ? 3 : 0));
          lighthouse(g, 47, 54, 40, "stripes");
          return g;
        },
      },
      {
        id: 8, name: "小岛",
        why: "海中间一块沙岛，岛上红顶白塔。",
        stamp: [4, 6, "ISLE"],
        pal: { sky: C.sky, sea: C.sea, sand: C.sand, foam: C.foam, white: C.white, red: C.red, dark: C.dark, rock: C.rock },
        make() {
          const g = grid("sky");
          seaBand(g, 30, N, "sea");
          for (let x = 18; x <= 46; x++) {
            const h = 42 - Math.round(8 * Math.sqrt(Math.max(0, 1 - ((x - 32) / 14) ** 2)));
            for (let y = h; y < 50; y++) set(g, x, y, "sand");
          }
          for (let x = 16; x <= 48; x++) set(g, x, 42, "foam");
          lighthouse(g, 32, 44, 34, "roof");
          return g;
        },
      },
      {
        id: 9, name: "左岸红塔",
        why: "灯塔在左边，塔身红，右边大片海。",
        stamp: [36, 6, "KM 12"],
        pal: { sky: C.sky, sea: C.sea, sand: C.sand, foam: C.foam, white: C.white, red: C.red, dark: C.dark, rock: C.rock },
        make() {
          const g = grid("sky");
          seaBand(g, 38, 52, "sea");
          sandFrom(g, (x) => (x < 26 ? Math.max(44, 52 - (26 - x) / 2.2) : 52));
          foamLine(g, (x) => (x < 26 ? Math.max(44, 52 - (26 - x) / 2.2) : 52));
          lighthouse(g, 16, 50, 40, "redbody");
          rocks(g, [[10, 48], [22, 49]]);
          return g;
        },
      },
      {
        id: 10, name: "夜航",
        why: "深蓝天，红白纹塔，灯室是黄的。",
        stamp: [4, 6, "12 24"],
        pal: { night: C.night, deep: C.deep, sand: C.sand, foam: C.foam, white: C.white, red: C.red, dark: C.dark, rock: C.rock, lamp: C.lamp },
        make() {
          const g = grid("night");
          seaBand(g, 40, 54, "deep");
          sandFrom(g, (x) => (x > 40 ? 50 : 54));
          lighthouse(g, 49, 52, 40, "lamp");
          for (let y = 20; y < 40; y++) {
            if ((y + 49) % 3 === 0) set(g, 52 + ((y % 2) ? 1 : 0), y, "lamp");
          }
          return g;
        },
      },
    ];

    const gallery = document.getElementById("gallery");
    SCENES.forEach((s) => {
      const clean = s.make();
      const stamped = s.make();
      stampOnSky(stamped, s.stamp[0], s.stamp[1], s.stamp[2]);
      const article = document.createElement("article");
      article.innerHTML = "<h2>" + s.id + " · " + s.name + "</h2><p class=\"why\">" + s.why + "</p><div class=\"row\"></div>";
      const row = article.querySelector(".row");
      [
        ["开局左图（带戳）", colorize(stamped, s.pal)],
        ["右图灰度", grayize(stamped)],
        ["修好（无戳）", colorize(clean, s.pal)],
      ].forEach(([label, cells]) => {
        const fig = document.createElement("figure");
        const canvas = document.createElement("canvas");
        blit(canvas, cells);
        const cap = document.createElement("figcaption");
        cap.textContent = label;
        fig.append(canvas, cap);
        row.append(fig);
      });
      gallery.append(article);
    });
  </script>
</body>
</html>
