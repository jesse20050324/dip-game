<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>第六关 · 十种图案方案</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #221e18;
      color: #e8dcc8;
      padding: 28px 32px 80px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .brief {
      color: #a89880;
      font-size: 13px;
      line-height: 1.55;
      max-width: 820px;
      margin: 0 0 28px;
      padding: 12px 14px;
      border-left: 3px solid #c4a268;
    }
    .brief strong { color: #f0e6d2; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
      gap: 28px;
    }
    article {
      background: #2c261e;
      border: 1px solid #3d3428;
      padding: 16px 16px 18px;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 4px;
      color: #f0e6d2;
    }
    .why {
      font-size: 12px;
      color: #9a8b74;
      margin: 0 0 12px;
      line-height: 1.45;
    }
    .row { display: flex; gap: 14px; flex-wrap: wrap; }
    figure { margin: 0; }
    figcaption {
      font-size: 11px;
      color: #9a8b74;
      margin-top: 6px;
      text-align: center;
    }
    canvas {
      display: block;
      width: 144px;
      height: 144px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #111;
      box-shadow: 0 6px 0 #14110e;
    }
  </style>
</head>
<body>
  <h1>第六关 · 十种图案方案（只看图，不是正式关）</h1>
  <p class="brief">
    <strong>机制和现在第六关完全一样：</strong>24×24，三层灰（雾 36 / 主体 112 / 底 220），雾只浮在背景上。
    颜色预填「白 / 主体色 / 白」，两把刀从两端夹出中间那一层。
    通关后：雾和底并成白，中间那层是主体色。爱心留给第七关，这里不重复。
    每套三张：修好 · 灰度带雾 · 开局整片主体色。
  </p>
  <div class="grid" id="gallery"></div>
  <script>
    const N = 24;
    const FOG = 36;
    const SUB = 112;
    const BG = 220;
    const WHITE = "#efe6d4";

    function makeGrid(fill) {
      return Array.from({ length: N }, () => Array(N).fill(fill));
    }

    function set(m, x, y, v = 1) {
      if (x >= 0 && x < N && y >= 0 && y < N) m[y][x] = v;
    }

    function disk(m, cx, cy, r, v = 1) {
      for (let y = 0; y < N; y++) {
        for (let x = 0; x < N; x++) {
          if ((x - cx) ** 2 + (y - cy) ** 2 <= r * r) m[y][x] = v;
        }
      }
    }

    function rect(m, x0, y0, w, h, v = 1) {
      for (let y = y0; y < y0 + h; y++) {
        for (let x = x0; x < x0 + w; x++) set(m, x, y, v);
      }
    }

    function ellipse(m, cx, cy, rx, ry, v = 1) {
      for (let y = 0; y < N; y++) {
        for (let x = 0; x < N; x++) {
          const dx = (x - cx) / rx;
          const dy = (y - cy) / ry;
          if (dx * dx + dy * dy <= 1) m[y][x] = v;
        }
      }
    }

    function paintFog(mask, stamps) {
      const fog = makeGrid(0);
      stamps.forEach(([cx, cy, r]) => disk(fog, cx, cy, r));
      const g = makeGrid(BG);
      for (let y = 0; y < N; y++) {
        for (let x = 0; x < N; x++) {
          if (mask[y][x]) g[y][x] = SUB;
          else if (fog[y][x]) g[y][x] = FOG;
        }
      }
      return g;
    }

    function paintTarget(mask, hex) {
      return mask.map((row) => row.map((v) => (v ? hex : WHITE)));
    }

    function paintStart(hex) {
      return makeGrid(hex);
    }

    function grayToHex(v) {
      const h = v.toString(16).padStart(2, "0");
      return "#" + h + h + h;
    }

    function blit(canvas, cells) {
      const ctx = canvas.getContext("2d");
      canvas.width = N;
      canvas.height = N;
      const img = ctx.createImageData(N, N);
      for (let y = 0; y < N; y++) {
        for (let x = 0; x < N; x++) {
          const c = cells[y][x];
          const hex = typeof c === "number" ? grayToHex(c) : c;
          const r = parseInt(hex.slice(1, 3), 16);
          const g = parseInt(hex.slice(3, 5), 16);
          const b = parseInt(hex.slice(5, 7), 16);
          const i = (y * N + x) * 4;
          img.data[i] = r;
          img.data[i + 1] = g;
          img.data[i + 2] = b;
          img.data[i + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
    }

    function fillPoly(m, pts) {
      for (let y = 0; y < N; y++) {
        const xs = [];
        for (let i = 0; i < pts.length; i++) {
          const [x1, y1] = pts[i];
          const [x2, y2] = pts[(i + 1) % pts.length];
          if ((y1 <= y && y2 > y) || (y2 <= y && y1 > y)) {
            xs.push(x1 + ((y - y1) * (x2 - x1)) / (y2 - y1));
          }
        }
        xs.sort((a, b) => a - b);
        for (let i = 0; i < xs.length; i += 2) {
          const a = Math.ceil(xs[i]);
          const b = Math.floor(xs[i + 1]);
          for (let x = a; x <= b; x++) set(m, x, y);
        }
      }
    }

    function starMask() {
      const m = makeGrid(0);
      const rows = {
        3: [[11, 13]],
        4: [[10, 14]],
        5: [[10, 14]],
        6: [[9, 15]],
        7: [[4, 20]],
        8: [[5, 19]],
        9: [[6, 18]],
        10: [[7, 17]],
        11: [[8, 16]],
        12: [[8, 16]],
        13: [[7, 10], [14, 17]],
        14: [[6, 10], [14, 18]],
        15: [[5, 9], [15, 19]],
        16: [[5, 8], [16, 19]],
      };
      Object.entries(rows).forEach(([y, spans]) => {
        spans.forEach(([a, b]) => {
          for (let x = a; x < b; x++) set(m, x, +y);
        });
      });
      return m;
    }

    function moonMask() {
      const m = makeGrid(0);
      disk(m, 11.2, 12, 7.6);
      disk(m, 15.4, 10.8, 6.0, 0);
      return m;
    }

    function fishMask() {
      const m = makeGrid(0);
      ellipse(m, 10, 12, 7.0, 4.2);
      const tail = [1, 3, 5, 5, 3, 1];
      tail.forEach((w, i) => {
        for (let k = 0; k < w; k++) set(m, 17 + k, 9 + i);
      });
      set(m, 6, 11, 0);
      set(m, 7, 11, 0);
      set(m, 6, 12, 0);
      return m;
    }

    function houseMask() {
      const m = makeGrid(0);
      for (let i = 0; i < 8; i++) {
        const w = 3 + i * 2;
        const x0 = 12 - (w - 1) / 2;
        for (let x = x0; x < x0 + w; x++) set(m, x, 5 + i);
      }
      rect(m, 6, 12, 12, 8);
      rect(m, 10, 15, 4, 5, 0);
      return m;
    }

    function pineMask() {
      const m = makeGrid(0);
      const layers = [
        [3, [1, 3, 5, 7, 9]],
        [8, [5, 7, 9, 11, 13]],
        [13, [7, 9, 11, 13, 15, 17]],
      ];
      layers.forEach(([y0, widths]) => {
        widths.forEach((w, i) => {
          const x0 = 12 - (w - 1) / 2;
          for (let x = x0; x < x0 + w; x++) set(m, x, y0 + i);
        });
      });
      rect(m, 11, 19, 3, 4);
      return m;
    }

    function mugMask() {
      const m = makeGrid(0);
      rect(m, 6, 7, 10, 12);
      rect(m, 7, 6, 8, 2);
      disk(m, 17.2, 12.5, 3.1);
      disk(m, 16.2, 12.5, 1.7, 0);
      rect(m, 15, 11, 2, 4, 0);
      return m;
    }

    function boltMask() {
      const m = makeGrid(0);
      fillPoly(m, [
        [10, 2], [17, 2], [13, 9], [18, 9], [7, 21],
        [11, 12], [6, 12], [11, 5], [7, 5],
      ]);
      return m;
    }

    function tulipMask() {
      const m = makeGrid(0);
      disk(m, 8.8, 8.4, 3.2);
      disk(m, 15.2, 8.4, 3.2);
      disk(m, 12, 9.8, 3.8);
      rect(m, 11, 14, 2, 8);
      ellipse(m, 8, 17.5, 3.6, 2.0);
      return m;
    }

    function catMask() {
      const m = makeGrid(0);
      disk(m, 12, 13.4, 6.6);
      fillPoly(m, [[5, 11], [7, 5], [11, 9]]);
      fillPoly(m, [[13, 9], [17, 5], [19, 11]]);
      set(m, 9, 12, 0);
      set(m, 10, 12, 0);
      set(m, 9, 13, 0);
      set(m, 14, 12, 0);
      set(m, 15, 12, 0);
      set(m, 15, 13, 0);
      return m;
    }

    function leafMask() {
      const m = makeGrid(0);
      ellipse(m, 12, 11.5, 5.4, 8.0);
      rect(m, 11, 19, 2, 4);
      for (let i = 6; i <= 17; i++) set(m, 12, i, 0);
      return m;
    }

    const SCHEMES = [
      {
        id: 1,
        name: "星",
        color: "#e8b84a",
        why: "五角靠圆点拼，轮廓尖、和爱心差得远。",
        mask: starMask,
        fog: [[17, 7, 3.1], [6, 16, 2.6], [18, 16, 2.4], [7, 7, 2.2]],
      },
      {
        id: 2,
        name: "月牙",
        color: "#d9c06a",
        why: "一块弯月，空处正好让雾贴在缺口边。",
        mask: moonMask,
        fog: [[18, 16, 3.0], [6, 7, 2.5], [8, 18, 2.3], [19, 8, 2.1]],
      },
      {
        id: 3,
        name: "鱼",
        color: "#3d8f8a",
        why: "横构图，尾和身体一眼分开。",
        mask: fishMask,
        fog: [[18, 6, 2.8], [5, 6, 2.4], [18, 18, 2.5], [6, 18, 2.2]],
      },
      {
        id: 4,
        name: "小屋",
        color: "#c46a3a",
        why: "三角屋顶 + 门洞，几何清楚。",
        mask: houseMask,
        fog: [[19, 8, 2.8], [4, 8, 2.4], [19, 18, 2.3], [4, 18, 2.1]],
      },
      {
        id: 5,
        name: "松",
        color: "#3f7a4a",
        why: "三层三角叠上去，和后边风景关的树不是一张图。",
        mask: pineMask,
        fog: [[18, 8, 2.9], [5, 8, 2.5], [19, 17, 2.3], [5, 18, 2.2]],
      },
      {
        id: 6,
        name: "杯子",
        color: "#4a6ea8",
        why: "带把手的杯子，中间挖空，雾可以贴在耳边。",
        mask: mugMask,
        fog: [[18, 6, 2.7], [5, 7, 2.5], [19, 18, 2.4], [6, 18, 2.2]],
      },
      {
        id: 7,
        name: "闪电",
        color: "#e0b040",
        why: "折线，和圆滚滚的爱心最不像。",
        mask: boltMask,
        fog: [[18, 7, 3.0], [6, 7, 2.4], [18, 18, 2.5], [6, 18, 2.2]],
      },
      {
        id: 8,
        name: "郁金香",
        color: "#c45a78",
        why: "花头 + 茎叶，竖构图，粉色。",
        mask: tulipMask,
        fog: [[19, 8, 2.8], [5, 8, 2.5], [18, 18, 2.3], [5, 18, 2.1]],
      },
      {
        id: 9,
        name: "猫头",
        color: "#c47a3a",
        why: "圆脸尖耳，眼睛是挖空的底色。",
        mask: catMask,
        fog: [[19, 8, 2.7], [4, 9, 2.4], [19, 18, 2.4], [5, 18, 2.2]],
      },
      {
        id: 10,
        name: "叶子",
        color: "#5a8f3a",
        why: "竖椭圆 + 叶脉挖空，比松树更扁。",
        mask: leafMask,
        fog: [[18, 6, 2.8], [5, 7, 2.5], [19, 17, 2.4], [6, 18, 2.2]],
      },
    ];

    const gallery = document.getElementById("gallery");
    SCHEMES.forEach((s) => {
      const mask = s.mask();
      const article = document.createElement("article");
      article.innerHTML =
        "<h2>" + s.id + " · " + s.name + "</h2>" +
        "<p class=\"why\">" + s.why + " 主体色 " + s.color + "</p>" +
        "<div class=\"row\"></div>";
      const row = article.querySelector(".row");
      const views = [
        ["修好（目标）", paintTarget(mask, s.color)],
        ["灰度 + 雾", paintFog(mask, s.fog)],
        ["开局（整片主体色）", paintStart(s.color)],
      ];
      views.forEach(([label, cells]) => {
        const fig = document.createElement("figure");
        const canvas = document.createElement("canvas");
        blit(canvas, cells);
        const cap = document.createElement("figcaption");
        cap.textContent = label;
        fig.append(canvas, cap);
        row.append(fig);
      });
      gallery.append(article);
    });
  </script>
</body>
</html>
