<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>H · 只有点</title>
    <link rel="stylesheet" href="skin.css" />
  </head>
  <body data-skin="dots">
    <p class="proto">H · <a href="../index.html">入口</a></p>

    <section class="screen title-screen" data-screen="title">
      <button type="button" class="start" data-act="continue" data-if-continue>CONTINUE</button>
      <button type="button" class="start ghost" data-go="select">LEVELS</button>
      <button type="button" class="start ghost" data-act="new">START</button>
    </section>

    <section class="screen select-screen" data-screen="select" hidden>
      <header class="top">
        <button type="button" class="quiet" data-go="title">←</button>
        <button type="button" class="quiet" data-act="settings">⚙</button>
      </header>
      <div class="lane" data-level-list="ch1"></div>
      <div class="lane small dim" data-chapter="ch2" data-level-list="ch2"></div>
    </section>

    <section class="screen play-screen" data-screen="play" hidden>
      <header class="top">
        <button type="button" class="quiet" data-go="select">←</button>
        <div class="lane compact" data-level-list="ch1"></div>
        <button type="button" class="quiet" data-act="pause">Ⅱ</button>
      </header>
      <section class="boards">
        <figure><div class="blank"></div></figure>
        <figure><div class="blank"></div></figure>
      </section>
      <section class="tools">
        <div class="axis">
          <div class="gray"></div>
          <div class="map">
            <i style="background:#f8f2e8;flex:2"></i>
            <i style="background:#c8bba6;flex:1.4"></i>
            <i style="background:#4a4036;flex:1.6"></i>
            <i class="empty" style="flex:1.2"></i>
          </div>
          <button type="button" class="handle" style="left:28%"></button>
          <button type="button" class="handle" style="left:52%"></button>
          <button type="button" class="handle" style="left:74%"></button>
        </div>
        <div class="tray">
          <button type="button" class="chip" style="background:#f8f2e8"></button>
          <button type="button" class="chip on" style="background:#c8bba6"></button>
          <button type="button" class="chip" style="background:#4a4036"></button>
          <button type="button" class="chip" style="background:#b5522a"></button>
        </div>
        <div class="bar">
          <button type="button" class="quiet fat" data-act="reset">↺</button>
          <button type="button" class="quiet fat go" data-act="confirm">✓</button>
        </div>
      </section>
    </section>

    <div class="overlay" data-overlay="pause" hidden>
      <div class="panel">
        <button type="button" class="start" data-act="close">CONTINUE</button>
        <button type="button" class="start ghost" data-go="select">LEVELS</button>
        <button type="button" class="start ghost" data-act="settings">⚙</button>
      </div>
    </div>
    <div class="overlay" data-overlay="clear" hidden>
      <div class="panel">
        <button type="button" class="start" data-act="next">NEXT</button>
        <button type="button" class="start ghost" data-act="replay">↺</button>
      </div>
    </div>
    <div class="overlay" data-overlay="settings" hidden>
      <div class="panel">
        <button type="button" class="start ghost" data-act="wipe">RESET</button>
        <button type="button" class="start" data-act="close">CLOSE</button>
      </div>
    </div>

    <template data-level-template>
      <button type="button" class="pip"></button>
    </template>
    <script src="../core.js"></script>
    <script>
      GameShell.create({ storageKey: "ui-shell-h-dots", wordless: true });
    </script>
  </body>
</html>
