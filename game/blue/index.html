<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Gray Workshop</title>
    <link rel="stylesheet" href="../style.css?v=blue15" />
    <link rel="stylesheet" href="blue.css?v=blue15" />
  </head>
  <body data-scheme="blue">
    <div class="screen" id="home">
      <canvas class="bo-bg" id="boBg" aria-hidden="true"></canvas>
      <button type="button" class="icon-btn corner-gear" id="gearBtn" aria-label="Settings">⚙</button>
      <button type="button" class="icon-btn speaker js-mute corner-mute" aria-label="Sound"></button>
      <canvas class="bo-icon bo-icon-gear" id="boGear" width="104" height="104" aria-hidden="true"></canvas>
      <canvas class="bo-icon bo-icon-mute" id="boMute" width="104" height="104" aria-hidden="true"></canvas>

      <div class="bo-stage boot-idle" id="boStage">
        <canvas class="bo-title" id="boTitle"></canvas>
        <button type="button" class="bo-cta" id="boCta">
          <canvas id="boCtaCv" width="260" height="68"></canvas>
        </button>
        <button type="button" class="bo-sub" id="boSub">
          <canvas id="boSubCv" width="260" height="68"></canvas>
        </button>
        <canvas class="bo-prog" id="boProgCv" width="180" height="52"></canvas>
        <canvas class="bo-dots" id="boDotsCv" width="220" height="28" aria-hidden="true"></canvas>

        <div class="bo-bar" id="boBar">
          <div class="bo-track bo-w12" id="boTrack">
            <div class="bo-fill" id="boFill"></div>
            <div class="bo-knob" id="boKnob">
              <span class="bo-knob-core"></span>
            </div>
          </div>
        </div>
      </div>

      <button type="button" class="bo-sr" id="startBtn">Play</button>
      <button type="button" class="bo-sr" id="selectBtn">Levels</button>
      <p class="bo-sr" id="homeProgress">0 / 13</p>
    </div>

    <div class="screen" id="levels" hidden>
      <header class="menu-top">
        <button type="button" class="icon-btn" id="levelsBack" aria-label="Home">
          <span class="back-mark"></span>
        </button>
        <h2 class="menu-title">Levels</h2>
        <button type="button" class="icon-btn speaker js-mute" aria-label="Sound"></button>
      </header>
      <div class="level-grid" id="levelGrid"></div>
    </div>

    <div class="sheet" id="playSheet" hidden>
      <header class="top">
        <button type="button" class="icon-btn" id="homeBtn" aria-label="Pause">
          <span class="pause-mark"></span>
        </button>
        <p class="level-label" id="levelLabel">1 / 13</p>
        <button type="button" class="icon-btn speaker js-mute" aria-label="Sound"></button>
      </header>

      <p class="scene" id="scene" hidden></p>
      <section class="boards" aria-label="The two images">
        <figure class="board" id="targetBoard">
          <canvas id="targetCanvas" width="432" height="432" aria-label="Target"></canvas>
        </figure>
        <figure class="board" id="workBoard">
          <canvas id="workCanvas" width="432" height="432" aria-label="Your image"></canvas>
        </figure>
      </section>

      <section class="axis-card">
        <div class="axis" id="axis">
          <div class="axis-marker" id="axisMarker" hidden></div>
          <div class="bars" id="bars">
            <div class="gray-bar" id="grayBar"></div>
            <div class="map-bar" id="mapBar" hidden></div>
            <div class="handles-layer" id="handlesLayer"></div>
          </div>
        </div>
        <div class="tray" id="tray" hidden></div>
      </section>

      <footer class="bar">
        <button type="button" class="reset" id="reset" aria-label="Reset Level">↺</button>
        <button type="button" class="confirm" id="confirm" hidden aria-label="Confirm">✓</button>
      </footer>
    </div>

    <div class="screen" id="done" hidden>
      <div class="home-card done-card">
        <div class="done-mark" aria-hidden="true">✓</div>
        <h1 class="done-title">Game Complete</h1>
        <p class="done-line">Every image is repaired.</p>
        <p class="home-progress" id="doneProgress">13 / 13</p>
        <button type="button" class="cta" id="againBtn">Home</button>
        <p class="credits">Sound: Kenney Interface Sounds (CC0)</p>
      </div>
    </div>

    <div class="ov" id="pauseOv" hidden>
      <div class="ov-card">
        <p class="ov-kicker">Paused</p>
        <button type="button" class="cta" id="pauseResume">Resume</button>
        <button type="button" class="cta cta-ghost" id="pauseRestart">Restart Level</button>
        <button type="button" class="cta cta-ghost" id="pauseLevels">Levels</button>
        <button type="button" class="cta cta-ghost" id="pauseHome">Home</button>
      </div>
    </div>

    <div class="ov" id="settingsOv" hidden>
      <div class="ov-card">
        <p class="ov-kicker">Settings</p>
        <button type="button" class="setting-row js-mute"><span>Sound</span><span data-mute-label>On</span></button>
        <button type="button" class="cta cta-ghost" id="wipeAsk">Reset Progress</button>
        <p class="ov-copy">A short game about repairing gray into color.<br />Sound: Kenney Interface Sounds (CC0)</p>
        <button type="button" class="cta" id="settingsClose">OK</button>
      </div>
    </div>

    <div class="ov" id="wipeOv" hidden>
      <div class="ov-card">
        <p class="ov-kicker">Reset progress?</p>
        <p class="ov-copy">All 13 levels go back to zero. Sound settings stay.</p>
        <button type="button" class="cta" id="wipeNo">Cancel</button>
        <button type="button" class="cta cta-ghost" id="wipeYes">Reset</button>
      </div>
    </div>

    <div class="ov" id="winOv" hidden>
      <div class="ov-card">
        <p class="ov-kicker">✓ Repaired</p>
        <p class="win-note" id="winNote" hidden></p>
        <button type="button" class="cta" id="winNext">Next Level</button>
      </div>
    </div>

    <script src="../photo-art.js?v=blue15"></script>
    <script src="../app.js?v=blue15"></script>
    <script src="slider-boot.js?v=blue15"></script>
    <script src="pixel-mask.js?v=blue15"></script>
    <script src="home.js?v=blue15"></script>
  </body>
</html>
