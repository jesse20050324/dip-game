<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game · 关卡表</title>
    <link rel="stylesheet" href="../shared/puzzle.css" />
    <link rel="stylesheet" href="../shared/scheme.css" />
    <link rel="stylesheet" href="../plain.css" />
  </head>
  <body data-layout="board">
    <a class="index-link" href="../index.html">全部</a>
    <main class="stage">
      <section id="home">
        <header class="topbar">
          <h1 class="logo" style="font-size:1.8rem">Game</h1>
          <div style="display:flex;gap:8px">
            <button type="button" class="icon-btn" data-go="about" aria-label="关于">i</button>
            <button type="button" class="icon-btn" data-go="settings" aria-label="设置">⚙</button>
            <button type="button" class="icon-btn speaker js-mute" aria-label="声音"></button>
          </div>
        </header>
        <p class="sub" id="sub" style="margin:0 0 14px">第 1 关</p>
        <div id="homeList"></div>
        <button type="button" class="cta float-continue" data-go="primary" data-verb>开始游戏</button>
      </section>
      <section id="done" hidden>
        <header class="topbar"><h1 class="logo" style="font-size:1.8rem">Game</h1></header>
        <p class="sub">两关都过了</p>
        <button type="button" class="cta" data-go="home">回关卡表</button>
      </section>
    </main>
    <div id="playSlot"></div>
    <div class="cover" id="pause" hidden>
      <div class="cover-card">
        <p class="overlay-kicker">暂停</p>
        <button type="button" class="cta" data-go="resume">继续</button>
        <button type="button" class="cta cta-ghost" data-go="restart">重开本关</button>
        <button type="button" class="cta cta-ghost" data-go="home">回关卡表</button>
      </div>
    </div>
    <div class="cover" id="settings" hidden>
      <div class="cover-card">
        <p class="overlay-kicker">设置</p>
        <button type="button" class="setting-row js-mute"><span>声音</span><span data-mute-label>声音开着</span></button>
        <button type="button" class="cta cta-ghost" data-go="wipe-ask">清除进度</button>
        <button type="button" class="cta" data-go="close">好</button>
      </div>
    </div>
    <div class="cover" id="wipe" hidden>
      <div class="cover-card">
        <p class="overlay-kicker">清除进度？</p>
        <p class="overlay-copy">两关都要重开。声音设置会留下。</p>
        <button type="button" class="cta" data-go="wipe-no">取消</button>
        <button type="button" class="cta cta-ghost" data-go="wipe-yes">清除</button>
      </div>
    </div>
    <div class="cover" id="about" hidden>
      <div class="cover-card">
        <p class="overlay-kicker">关于</p>
        <p class="credits-p">打开就是关卡表。继续停在表下面，不再先做一张标题页。</p>
        <p class="credits-p">声音：Kenney Interface Sounds（CC0）。</p>
        <button type="button" class="cta" data-go="close">好</button>
      </div>
    </div>
    <script src="../shared/kit.js"></script>
    <script src="../shared/puzzle.js"></script>
    <script src="../shared/ux.js"></script>
    <script src="../plain.js"></script>
  </body>
</html>
