<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1e6d0" />
    <title>灰度 · 掌机</title>
    <link rel="stylesheet" href="../shared/puzzle.css" />
    <link rel="stylesheet" href="../shared/scheme.css" />
    <link rel="stylesheet" href="skin.css" />
  </head>
  <body data-scheme="pocket">
    <a class="index-link" href="../index.html">全部外壳</a>
    <p class="eyebrow">01 · 掌机</p>
    <main class="device">
      <div class="lcd">
        <span class="led" aria-hidden="true"></span>
        <section id="home">
          <p class="kicker">Chapter 1</p>
          <h1>灰度</h1>
          <p class="lcd-line" id="homeLine">卡带在槽里。</p>
          <div class="mini-carts" id="miniCarts"></div>
          <p class="ver">0.4</p>
        </section>
        <section id="carts" hidden>
          <h2 class="menu-title">卡带</h2>
          <div class="cart-list" id="cartList"></div>
          <button type="button" class="cta cta-ghost" id="cartsClose">回到屏幕</button>
        </section>
        <div id="playSlot"></div>
        <section id="done" hidden>
          <p class="kicker">Chapter 1</p>
          <h1>灰度</h1>
          <p class="lcd-line">两张都修好了。</p>
          <button type="button" class="cta" id="doneClose">合上</button>
        </section>
        <section id="back" hidden>
          <h2 class="menu-title">背面</h2>
          <p class="credits-p">灰度。把右边修成左边。这一面是机壳背面，不是另一套菜单。</p>
          <p class="credits-p">声音：Kenney Interface Sounds（CC0）。click_003、drop_002、confirmation_001、error_005、back_003。</p>
          <button type="button" class="setting-row js-mute">
            <span>声音</span>
            <span data-mute-label>声音开着</span>
          </button>
          <button type="button" class="cta cta-ghost" id="resetAsk">清除存档</button>
          <button type="button" class="cta" id="backClose">翻回来</button>
          <p class="ver">0.4 · 掌机</p>
        </section>
      </div>
      <div class="bezel">
        <div class="grill" aria-hidden="true"></div>
        <button type="button" class="power" id="powerBtn" data-action="primary">开机</button>
        <button type="button" class="icon-btn speaker js-mute bezel-mute" aria-label="声音"></button>
        <button type="button" class="text-link" id="toCarts">卡带</button>
        <button type="button" class="text-link" id="flipBtn">背面</button>
      </div>
    </main>

    <div class="cover" id="pause" hidden>
      <div class="cover-card">
        <p class="overlay-kicker">系统菜单</p>
        <button type="button" class="cta" id="resumeBtn">继续游戏</button>
        <button type="button" class="cta cta-ghost" id="pauseCarts">卡带</button>
        <button type="button" class="cta cta-ghost js-mute"><span data-mute-label>声音开着</span></button>
        <button type="button" class="cta cta-ghost" id="pauseHome">回标题</button>
      </div>
    </div>
    <div class="cover" id="wipe" hidden>
      <div class="cover-card">
        <p class="overlay-kicker">清除存档？</p>
        <p class="overlay-copy">两关重来。侧边的声音开关会留下。</p>
        <button type="button" class="cta" id="wipeNo">留下</button>
        <button type="button" class="cta cta-ghost" id="wipeYes">清掉</button>
      </div>
    </div>

    <script src="../shared/kit.js"></script>
    <script src="../shared/puzzle.js"></script>
    <script src="../shared/ux.js"></script>
    <script src="shell.js"></script>
  </body>
</html>
