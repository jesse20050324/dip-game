<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>音效试听</title>
    <style>
      :root {
        --paper: #f1e6d0;
        --card: #fff8ec;
        --ink: #3b3128;
        --muted: #7a6b5b;
        --line: #d7c4a6;
        --accent: #c45c26;
        --accent-deep: #9a3f16;
        --good: #3d6b4f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 8%, #f7ecda 0, transparent 42%),
          var(--paper);
        padding: 28px 20px 64px;
      }
      h1 { margin: 0 0 8px; font-size: 1.6rem; }
      .lead { margin: 0 0 28px; color: var(--muted); max-width: 56ch; line-height: 1.55; }
      a { color: var(--accent-deep); }
      section {
        background: var(--card);
        border: 1px solid #eadcc4;
        border-radius: 20px;
        padding: 18px 18px 14px;
        margin: 0 auto 16px;
        max-width: 760px;
        box-shadow: 0 8px 22px rgba(70, 48, 24, 0.08);
      }
      h2 { margin: 0 0 4px; font-size: 1.05rem; }
      .why { margin: 0 0 12px; color: var(--muted); font-size: 0.9rem; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; }
      button {
        border: 0;
        border-radius: 14px;
        padding: 10px 14px;
        background: #efe0c8;
        color: var(--ink);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 2px 0 #cbb89a;
      }
      button:active { transform: translateY(1px); box-shadow: 0 1px 0 #cbb89a; }
      button.playing { background: var(--accent); color: #fff; box-shadow: 0 2px 0 var(--accent-deep); }
      button.chosen { outline: 2px solid var(--good); outline-offset: 1px; }
      .now { font-size: 0.8rem; color: var(--muted); margin-top: 10px; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <h1>音效试听</h1>
    <p class="lead">
      Kenney Interface Sounds（CC0）。绿框是游戏里正在用的。旧候选都留着，后面补了新的。
      游戏：<a href="index.html">打开 Game</a>
    </p>
    <div id="lab"></div>
    <script>
      const GROUPS = [
        {
          id: "tap",
          title: "点按",
          why: "开始、返回、选关、喇叭。",
          chosen: "click_003.wav",
          files: [
            "click_001.wav", "click_002.wav", "click_003.wav", "click_004.wav", "select_001.wav",
            "click_005.wav", "select_002.wav", "select_003.wav", "select_004.wav", "select_005.wav",
            "select_006.wav", "select_007.wav", "select_008.wav", "switch_001.wav", "tick_001.wav",
          ],
        },
        {
          id: "chip",
          title: "落色",
          why: "颜色放到映射轴上。",
          chosen: "drop_002.wav",
          files: [
            "drop_001.wav", "drop_002.wav", "drop_003.wav", "pluck_001.wav", "pluck_002.wav",
            "drop_004.wav", "switch_002.wav", "switch_003.wav", "switch_004.wav", "switch_005.wav",
            "switch_006.wav", "switch_007.wav", "open_001.wav", "open_002.wav", "tick_002.wav",
          ],
        },
        {
          id: "ok",
          title: "过关",
          why: "判定成功。",
          chosen: "confirmation_001.wav",
          files: [
            "confirmation_001.wav", "confirmation_002.wav", "confirmation_003.wav", "confirmation_004.wav", "maximize_001.wav",
            "maximize_002.wav", "maximize_003.wav", "maximize_004.wav", "maximize_005.wav", "maximize_006.wav",
            "maximize_007.wav", "maximize_008.wav", "maximize_009.wav", "open_003.wav", "open_004.wav",
          ],
        },
        {
          id: "no",
          title: "错误",
          why: "判定失败。",
          chosen: "error_006.wav",
          files: [
            "bong_001.wav", "error_002.wav", "error_003.wav", "error_004.wav", "error_006.wav",
            "error_001.wav", "error_005.wav", "error_007.wav", "error_008.wav", "close_001.wav",
            "close_002.wav", "close_003.wav", "close_004.wav", "question_001.wav", "question_002.wav",
          ],
        },
        {
          id: "reset",
          title: "重置",
          why: "本关重来。",
          chosen: "back_003.wav",
          files: [
            "back_001.wav", "back_002.wav", "back_003.wav", "back_004.wav", "scratch_001.wav",
            "scratch_002.wav", "scratch_003.wav", "scratch_004.wav", "scratch_005.wav", "minimize_001.wav",
            "minimize_002.wav", "minimize_003.wav", "minimize_004.wav", "minimize_005.wav", "scroll_001.wav",
          ],
        },
      ];
      let current = null;
      const lab = document.getElementById("lab");
      GROUPS.forEach((group) => {
        const sec = document.createElement("section");
        sec.innerHTML = `<h2>${group.title}</h2><p class="why">${group.why} 使用中：${group.chosen.replace(".wav", "")}</p>`;
        const row = document.createElement("div");
        row.className = "row";
        const now = document.createElement("p");
        now.className = "now";
        group.files.forEach((file) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = file.replace(".wav", "");
          if (file === group.chosen) btn.classList.add("chosen");
          btn.addEventListener("click", () => {
            if (current) {
              current.pause();
              current = null;
            }
            row.querySelectorAll("button").forEach((b) => b.classList.remove("playing"));
            const audio = new Audio(`audio/candidates/${group.id}/${file}`);
            current = audio;
            btn.classList.add("playing");
            now.textContent = file;
            audio.play().catch(() => {});
            audio.addEventListener("ended", () => btn.classList.remove("playing"));
          });
          row.appendChild(btn);
        });
        sec.append(row, now);
        lab.appendChild(sec);
      });
    </script>
  </body>
</html>
